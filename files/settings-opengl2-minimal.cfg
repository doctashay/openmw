# OpenGL 2.0 Minimal preset.
# This caps rendering to the GL 2.0 / GLSL 1.10 path and disables all optional
# shader-driven effects. Place this file next to settings-default.cfg and load
# it before user settings if you want a guaranteed GL2-compatible setup.

[Camera]
reverse z = false

[Shaders]
force shaders = false
lighting method = legacy
force per pixel lighting = false
apply lighting to environment maps = false
auto use object normal maps = false
auto use object specular maps = false
auto use terrain normal maps = false
auto use terrain specular maps = false
adjust coverage for alpha test = false
soft particles = false

[Shadows]
enable shadows = false

[Fog]
radial fog = false
exponential fog = false
sky blending = false

[Post Processing]
enabled = false
transparent postpass = false

[Water]
shader = false
refraction = false
reflection detail = 0
sunlight scattering = false
wobbly shores = false

[Stereo]
stereo enabled = false
multiview = false

[Groundcover]
enabled = false
